# GitHub Pages site for design-os-github-page, built from this docs/ folder.
# _layouts/default.html wraps every Markdown page in the landing's design language;
# index.html is a hand-built page (layout: null) sharing assets/site.css.
# jekyll-seo-tag emits <title>, <meta name="description">, Open Graph and JSON-LD;
# jekyll-sitemap emits sitemap.xml for Google Search Console.
title: design-os-github-page
description: Universal zero-dependency GitHub Pages template, CLI scaffolder, and 9-tier layout engine with built-in SEO, XML Sitemap, llms.txt (GEO), and Schema.org FAQPage (AEO).
url: https://jangtrinh.github.io
baseurl: /design-os-github-page
lang: en
repository: jangtrinh/design-os-github-page
repository_url: https://github.com/jangtrinh/design-os-github-page
wordmark: DESIGN:OS
wordmark_url: https://jangtrinh.github.io/design-os/
eyebrow: DESIGN:OS Toolchain          # short product family label, e.g. design:os
logo: /images/cover.png          # a real capture under docs/images/
nav:                        # one entry per Markdown page under docs/, in reading order
  - { title: Deep dive, url: /deep-dive.html }
footer:
  - { title: GitHub, url: https://github.com/jangtrinh/design-os-github-page }
  - { title: MIT, url: https://github.com/jangtrinh/design-os-github-page/blob/main/LICENSE }
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-relative-links
relative_links:
  enabled: true
  collections: false
defaults:
  - scope: { path: "" }
    values: { layout: default }
  - scope: { path: "google*.html" }
    values: { sitemap: false }
