# GitHub Pages site for {{REPO}}, built from this docs/ folder.
# _layouts/default.html wraps every Markdown page in the landing's design language;
# index.html is a hand-built page (layout: null) sharing assets/site.css.
# jekyll-seo-tag emits <title>, <meta name="description">, Open Graph and JSON-LD;
# jekyll-sitemap emits sitemap.xml for Google Search Console.
title: {{REPO}}
description: {{META_DESCRIPTION}}
url: https://{{OWNER}}.github.io
baseurl: /{{REPO}}
lang: en
repository: {{OWNER}}/{{REPO}}
repository_url: https://github.com/{{OWNER}}/{{REPO}}
wordmark: {{WORDMARK}}
wordmark_url: {{WORDMARK_URL}}
eyebrow: {{EYEBROW}}          # short product family label, e.g. design:os
logo: {{LOGO_PATH}}          # a real capture under docs/images/
nav:                        # one entry per Markdown page under docs/, in reading order
  - { title: Deep dive, url: /deep-dive.html }
footer:
  - { title: GitHub, url: https://github.com/{{OWNER}}/{{REPO}} }
  - { title: MIT, url: https://github.com/{{OWNER}}/{{REPO}}/blob/main/LICENSE }
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-relative-links
relative_links:
  enabled: true
  collections: false
defaults:
  - scope: { path: "" }
    values: { layout: default }
  - scope: { path: "google*.html" }
    values: { sitemap: false }
